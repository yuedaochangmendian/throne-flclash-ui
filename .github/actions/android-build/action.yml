name: Android build
description: >-
  Shared build steps of ci.yml, preview.yml and release.yml: JDK 17, Flutter module AAR (the gitignored
  flutter/build/host/outputs/repo the app links), ThroneCore AAR + sing-box schema, routeprofiles
  snapshot, sing-box dashboard, Gradle, then ./gradlew <tasks>. With sign=true, release builds are signed with the
  SIGNING_* secrets from the job environment; the build fails without them.
inputs:
  tasks:
    description: Gradle tasks to run
    required: true
  channel:
    description: stable or preview (BuildConfig.PREVIEW, versionName suffix -pre.<build-number>)
    required: false
    default: stable
  build-number:
    description: last three digits of versionCode (999 stable tag build, commits since the last stable tag for previews)
    required: false
    default: '0'
  sign:
    description: sign release builds (true/false)
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    # The NDK the app's ndkVersion asks for, plus the SDK platform the Flutter module now
    # compiles against. Both are installed before the Flutter AAR: without them the first
    # Gradle build auto-installs the NDK mid-build, where a truncated dl.google.com download
    # (seen 2026-11-02) fails the run with no retry, and a missing platform fails the AAR
    # build outright. Three tries ride out a flaky CDN.
    #
    # Why platforms;android-37.0 and not android-37: the SDK now publishes the 37 line with
    # minor versions, so the package id — and the directory, `platforms/android-37.0` — carries
    # the minor. `compileSdk = 37` resolves to it. build-tools 35.0.1 is what Helpers.kt pins.
    - name: Install NDK, platform 37 and build-tools
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          # printf, not yes: `yes |` dies of a broken pipe when sdkmanager stops reading,
          # and with pipefail that reads as a failure even after a clean install. Four y's
          # cover a runner image that ever ships more than one unaccepted license.
          if printf 'y\ny\ny\ny\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;28.2.13676358" "platforms;android-37.0" "build-tools;35.0.1"; then
            break
          fi
          if [ "$attempt" = "3" ]; then
            echo "::error::the SDK packages (NDK 28.2.13676358, platform 37.0, build-tools 35.0.1) failed to install three times"
            exit 1
          fi
          sleep 20
        done
    # `flutter build aar` now compiles the rust_api native asset, so the host needs a Rust
    # toolchain with the Android triples AND the linux host triple (the hook validates against
    # flutter/plugins/rust_api/rust/rust-toolchain.toml), plus libclang for rquickjs's
    # bindgen step, which is enabled only on Android.
    #
    # NDK 28.2.13676358 ships libclang.so, and plugins/rust_api/hook/build.dart points
    # LIBCLANG_PATH at it; libclang-dev is installed anyway so the hook's fallback (and any
    # tool that looks in the distro location) resolves on a runner whose NDK layout differs.
    - name: Install Rust and libclang for the rust_api native asset
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libclang-dev
    - name: Set up Rust (channel and targets from rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: '1.99.0'
        targets: x86_64-unknown-linux-gnu,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
    - name: Point the hook at cleartext NDK paths
      shell: bash
      run: |
        set -euo pipefail
        NDK="$ANDROID_HOME/ndk/28.2.13676358"
        test -d "$NDK" || { echo "::error::the NDK is not at $NDK"; exit 1; }
        echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
        # flutter_tools resolves NDK clang from ANDROID_NDK_HOME first, then the newest
        # directory under $ANDROID_HOME/ndk. Setting it explicitly keeps the AAR build on the
        # same NDK version the app's ndkVersion names.
        LIBCLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib"
        if [ -d "$LIBCLANG" ]; then
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"
        fi
    # The app links io.flrone.ui:flutter_release:1.0 from flutter/build/host/outputs/repo, which the
    # repository ignores; without this step the Gradle build cannot resolve the Flutter module at all.
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        # Pinned to the toolchain the AAR is developed against; `flutter --version` on the dev box is the source.
        flutter-version: '3.47.9'
        cache: true
    - name: Flutter AAR
      shell: bash
      run: |
        set -euo pipefail
        cd flutter
        flutter pub get
        # The committed host at flutter/android/ (not the generated flutter/.android/) is what
        # Gradle runs in, and its build.gradle raises every module's compileSdk to 37 — the
        # generated template host compiles the module against 36, which AGP rejects once it
        # resolves a plugin AAR whose metadata says minCompileSdk=37. Assert the directory is
        # there, so a checkout that lost it fails here with a clear message instead of deep
        # inside the AAR build.
        test -f android/build.gradle || {
          echo "::error::flutter/android/ (the committed host) is missing; the module would"
          echo "::error::fall back to the template host, whose compileSdk is 36."
          exit 1
        }
        # include_flutter.groovy (evaluated by the committed host's settings.gradle)
        # asserts that .android/local.properties exists and reads flutter.sdk from
        # it. With a committed host, `flutter pub get` does not always write that
        # file on CI, so seed it explicitly from the toolchain the action installed.
        mkdir -p .android
        {
          echo "sdk.dir=$ANDROID_HOME"
          echo "flutter.sdk=$FLUTTER_ROOT"
        } > .android/local.properties
        flutter build aar --no-debug --no-profile
    - name: ThroneCore AAR and schema
      uses: ./.github/actions/throne-core
    - name: Fetch routeprofiles snapshot
      uses: ./.github/actions/routeprofiles
    - name: Fetch sing-box dashboard
      uses: ./.github/actions/sing-box-dashboard
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
    - name: Gradle build
      shell: bash
      env:
        THRONE_CHANNEL: ${{ inputs.channel }}
        THRONE_BUILD: ${{ inputs.build-number }}
        THRONE_SIGN: ${{ inputs.sign }}
      run: |
        set -euo pipefail
        if [ "$THRONE_SIGN" = "true" ]; then
          if [ -n "${SIGNING_KEYSTORE_B64:-}" ]; then
            : "${SIGNING_STORE_PASSWORD:?the SIGNING_STORE_PASSWORD secret is missing}"
            : "${SIGNING_KEY_ALIAS:?the SIGNING_KEY_ALIAS secret is missing}"
            KS="$RUNNER_TEMP/release-signing.keystore"
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode --ignore-garbage > "$KS"
            UPDATE_SIGNER_SHA256=$(keytool -exportcert -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" \
              -alias "$SIGNING_KEY_ALIAS" | sha256sum | cut -d' ' -f1)
            rm -f "$KS"
            export UPDATE_SIGNER_SHA256
            echo "Signing with the release key from the repository secrets (certificate SHA-256 $UPDATE_SIGNER_SHA256)"
          else
            echo "::error::No signing key: add the SIGNING_* repository secrets"
            exit 1
          fi
        else
          unset SIGNING_KEYSTORE_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD
        fi
        ./gradlew --stacktrace ${{ inputs.tasks }}
