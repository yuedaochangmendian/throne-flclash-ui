name: Build ThroneCore AAR
description: >-
  Builds app/libs/ThroneCore.aar and generates app/src/main/assets/schema/sing-box.json (with the Android build tags)
  from throneproj/Throne at the THRONE_CORE_REF pinned in nb4a.properties. Both are cached on the pinned ref, the
  composite action and the core bridge patch before any upstream checkout.
runs:
  using: composite
  steps:
    - name: Read core pin
      shell: bash
      run: |
        set -euo pipefail
        REF=$(sed -n 's/^THRONE_CORE_REF=//p' nb4a.properties | tr -d '\r[:space:]')
        test -n "$REF"
        echo "THRONE_CORE_REF=$REF" >> "$GITHUB_ENV"
    # THRONE_CORE_REF is pinned to an immutable commit, so the resolved SHA and
    # its build script hash from a fresh checkout were redundant in this key.
    # Restoring here avoids cloning and patching Throne on every cache hit.
    - name: ThroneCore cache
      id: cache
      uses: actions/cache@v6
      with:
        path: |
          app/libs/ThroneCore.aar
          app/src/main/assets/schema/sing-box.json
        key: throne-core-${{ runner.os }}-${{ env.THRONE_CORE_REF }}-${{ hashFiles('.github/actions/throne-core/action.yml', 'buildScript/core-patch/**') }}
    - name: Checkout Throne
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        THRONE_DIR="$(dirname "$GITHUB_WORKSPACE")/Throne"
        rm -rf "$THRONE_DIR"
        git init -q "$THRONE_DIR"
        git -C "$THRONE_DIR" remote add origin https://github.com/throneproj/Throne
        git -C "$THRONE_DIR" fetch -q --depth 1 origin "$THRONE_CORE_REF"
        git -C "$THRONE_DIR" checkout -q --detach FETCH_HEAD
        echo "THRONE_DIR=$THRONE_DIR" >> "$GITHUB_ENV"
    - name: Apply core bridge patch
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Additive only: the throne_* C ABI lands in core/mobile so the AAR's
        # shared library exports it for Dart FFI and the android/core JNI shim.
        bash buildScript/apply-core-patch.sh "$THRONE_DIR"
    - name: Install Golang
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'
        cache: false
    - name: Go module cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: ~/go/pkg/mod
        key: go-mod-throne-${{ runner.os }}-${{ env.THRONE_CORE_REF }}
        restore-keys: |
          go-mod-throne-${{ runner.os }}-
    - name: Setup Java
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android NDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
    - name: Install gomobile
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
        go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Build ThroneCore AAR
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}
      run: DEST="$GITHUB_WORKSPACE/app/libs" bash script/build_android.sh
    # Same registries as the AAR: the Android TAGS of script/build_android.sh (cf. script/gen_schema.sh). with_purego and
    # CGO_ENABLED=0 only keep cronet-go from linking its static library; option registration does not depend on them.
    - name: Generate sing-box schema
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}/core
      run: |
        set -euo pipefail
        TAGS=$(sed -n 's/^TAGS="\(.*\)"$/\1/p' ../script/build_android.sh)
        test -n "$TAGS"
        OUT="$GITHUB_WORKSPACE/app/src/main/assets/schema/sing-box.json"
        mkdir -p "$(dirname "$OUT")"
        CGO_ENABLED=0 go run -trimpath -ldflags=-checklinkname=0 -tags "$TAGS,with_purego" ./cmd/schemagen -o "$OUT"
    - name: Verify ThroneCore AAR and schema
      shell: bash
      run: |
        set -euo pipefail
        test -s app/libs/ThroneCore.aar
        unzip -l app/libs/ThroneCore.aar > "$RUNNER_TEMP/throne-core-aar.txt"
        unzip -p app/libs/ThroneCore.aar classes.jar > "$RUNNER_TEMP/throne-core-classes.jar"
        unzip -l "$RUNNER_TEMP/throne-core-classes.jar" > "$RUNNER_TEMP/throne-core-classes.txt"
        grep -q 'io/throneproj/mobile/Mobile.class' "$RUNNER_TEMP/throne-core-classes.txt"
        grep -q 'go/Seq.class' "$RUNNER_TEMP/throne-core-classes.txt"
        # the APK splits (buildSrc Helpers.kt) must match the core targets
        for abi in arm64-v8a armeabi-v7a x86_64; do
          grep -q "jni/$abi/libthrone.so" "$RUNNER_TEMP/throne-core-aar.txt" \
            || { echo "::error::ThroneCore.aar has no jni/$abi/libthrone.so"; exit 1; }
        done
        python3 -c 'import json, sys; json.load(open(sys.argv[1]))' app/src/main/assets/schema/sing-box.json
        # The upstream AAR is binary-only: its `io.flrone/*` channel strings are
        # invisible to channel_audit.py. Fail a ref bump that widens that surface.
        python3 tools/diagnostics/aar_channel_audit.py app/libs/ThroneCore.aar
