name: CI
on:
  # Feature branches are validated through their PR only. Running both push and
  # pull_request for every branch duplicated the same jobs and artifact uploads.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # paths-filter needs both sides of a push or pull-request diff.
          fetch-depth: 0
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'app/**'
              - 'android/**'
              - 'bboxmodel/**'
              - 'buildSrc/**'
              - 'buildScript/**'
              - 'flutter/**'
              - 'gradle/**'
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'tools/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'repositories.gradle.kts'
              - 'lint.xml'
              - 'nb4a.properties'

  build:
    name: Unit tests and debug build
    needs: changes
    if: ${{ needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        if: ${{ needs.changes.outputs.code == 'true' }}
        uses: ./.github/actions/android-build
        with:
          tasks: app:testOssDebugUnitTest app:assembleOssDebug
      - name: Scan the Flutter AAR for unbacked API references
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          AAR=$(find flutter/build/host/outputs/repo -name "*.aar" | head -1)
          test -n "$AAR"
          python3 tools/diagnostics/scan_aar_apis.py "$AAR"
      # The AAR's `io.flrone/*` channels have no in-repo Kotlin counterpart to
      # diff against; the budget in aar_channels.txt is their contract.
      - name: Audit the vendored AAR channel surface
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          AAR=$(find flutter/build/host/outputs/repo -name "*.aar" | head -1)
          test -n "$AAR"
          python3 tools/diagnostics/aar_channel_audit.py "$AAR"
      # The NDK is installed by android-build; its clang is the exact one the
      # release build uses, so preamble syntax errors are caught before linking.
      - name: Check cgo preambles
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          CLANG="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          python3 tools/diagnostics/check_preamble.py
      - name: Docs-only fast path
        if: ${{ needs.changes.outputs.code != 'true' }}
        run: echo "No code paths changed; skipped the Android build and AAR audits."

  flutter-tests:
    name: Flutter module tests
    needs: changes
    if: ${{ needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Channel contract audit
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: python3 tools/diagnostics/channel_audit.py
      - name: Bridge contract audits
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          python3 tools/diagnostics/symbol_audit.py
          # ADR 0002's action bus: Go Method constants, dispatcher registry and
          # Dart ActionMethod must agree by wire name. It is a no-op until the
          # protocol files land in phase 1, then becomes a hard gate.
          python3 tools/diagnostics/action_contract.py
          python3 tools/diagnostics/settings_audit.py --summary
          python3 tools/diagnostics/ffi_regression_test.py
          python3 tools/diagnostics/generated_models_check.py
          # Dart reads Room's file directly, so Room's schema version has a second
          # copy in db.dart. A bump on one side alone still compiles and still
          # queries — it just reads the wrong column.
          python3 tools/diagnostics/schema_audit.py
          # The JVM accepts regexes Android's ICU rejects; see the pre.17 crash.
          python3 tools/diagnostics/kotlin_regex_audit.py
          python3 tools/diagnostics/py_syntax_check.py tools/diagnostics/*.py tools/bindgen/*.py buildScript/*.py
      # Locale completeness is a report, not a gate: the 885 known gaps across 19
      # locales predate this job and are burned down incrementally.
      # `continue-on-error` keeps the list visible on every code push without
      # blocking it.
      - name: i18n coverage report
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: python3 tools/diagnostics/i18n_coverage.py --summary
        continue-on-error: true
      - name: Set up Flutter
        if: ${{ needs.changes.outputs.code == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze
        if: ${{ needs.changes.outputs.code == 'true' }}
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --fatal-infos
      - name: Test
        if: ${{ needs.changes.outputs.code == 'true' }}
        working-directory: flutter
        run: flutter test --coverage
      - name: Coverage floor
        if: ${{ needs.changes.outputs.code == 'true' }}
        working-directory: flutter
        # --report-dirs prints every lib/<dir> percentage so per-directory floors
        # (--min-dir lib/data:NN) can be set from a measured number, not a guess.
        run: |
          python3 ../tools/diagnostics/coverage_gate.py coverage/lcov.info \
            --min 60 \
            --exclude 'lib/core/throne_ffi.dart' \
            --exclude 'lib/ui/**' \
            --min-dir lib/box_api.dart:32 \
            --min-dir lib/pages:50 \
            --report-dirs
      - name: Upload coverage
        if: ${{ always() && needs.changes.outputs.code == 'true' && (github.event_name == 'push' || failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: flutter/coverage/lcov.info
          if-no-files-found: warn
      - name: Docs-only fast path
        if: ${{ needs.changes.outputs.code != 'true' }}
        run: echo "No code paths changed; skipped Flutter analysis, tests and contract audits."
