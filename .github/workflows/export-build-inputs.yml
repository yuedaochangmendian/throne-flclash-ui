name: Export local build inputs
# One-off helper: the ThroneCore AAR and sing-box schema are gitignored build
# inputs produced by .github/actions/throne-core. Exporting them lets a local
# Windows dev box assemble an APK and verify it in an emulator without running
# gomobile locally.
on:
  workflow_dispatch:
jobs:
  export:
    name: Export ThroneCore AAR and schema
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: ThroneCore AAR and schema
        uses: ./.github/actions/throne-core
      - name: Upload build inputs
        uses: actions/upload-artifact@v7
        with:
          name: throne-core-build-inputs
          path: |
            app/libs/ThroneCore.aar
            app/src/main/assets/schema/sing-box.json
          if-no-files-found: error
          retention-days: 3
