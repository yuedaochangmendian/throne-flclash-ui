name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release v<VERSION_NAME> at this commit (otherwise the APKs are only uploaded as a workflow artifact)
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
env:
  # A pushed v* tag publishes without a manual dispatch.
  PUBLISH: ${{ inputs.publish == true || startsWith(github.ref, 'refs/tags/v') }}
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    name: Build and publish a release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The tag is v<VERSION_NAME>; a published release never reuses an existing tag.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
            TAG="v$VERSION_NAME"
          fi
          test -n "$VERSION_NAME"
          if [ "$PUBLISH" = "true" ] && [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            # 0 = the tag exists, 2 = no matching tag, anything else is a
            # transport failure. A failure must not be read as "tag is free":
            # publishing over a possibly existing tag would clobber a live
            # release, so it retries and then refuses to continue.
            ls_rc=0
            for _ in 1 2 3; do
              if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
                ls_rc=0
              else
                ls_rc=$?
              fi
              if [ "$ls_rc" -eq 0 ] || [ "$ls_rc" -eq 2 ]; then break; fi
              echo "::warning::git ls-remote could not reach origin (exit $ls_rc); retrying"
              sleep 5
            done
            if [ "$ls_rc" -eq 0 ]; then
              echo "::error::$TAG already exists: raise VERSION_NAME in nb4a.properties for a new release"
              exit 1
            elif [ "$ls_rc" -ne 2 ]; then
              echo "::error::could not verify whether $TAG exists (git ls-remote exit $ls_rc); retry the dispatch"
              exit 1
            fi
          fi
          # A versionName containing "-pre." is a preview build: it must use the
          # preview channel (release_assets.py refuses a -pre. name on stable)
          # and must be marked as a GitHub prerelease so the in-app updater,
          # which follows releases/latest, never offers it to existing users.
          if [[ "$VERSION_NAME" == *-pre.* ]]; then
            CHANNEL=preview
            PRERELEASE=true
            BASE_VERSION="${VERSION_NAME%%-pre.*}"
            BUILD_NUMBER="${VERSION_NAME##*-pre.}"
            [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || {
              echo "::error::preview tag must end in -pre.<number>"
              exit 1
            }
            # 999 is the stable slot: a preview taking it would build the same
            # versionCode as the stable release of the same version (see
            # Helpers.kt), and two different builds would claim one code.
            (( 10#$BUILD_NUMBER >= 1 && 10#$BUILD_NUMBER <= 998 )) || {
              echo "::error::preview build number must be 1..998 (999 is the stable slot)"
              exit 1
            }
          else
            CHANNEL=stable
            PRERELEASE=false
            BASE_VERSION="$VERSION_NAME"
            BUILD_NUMBER=999
          fi
          DECLARED=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          if [ "$BASE_VERSION" != "$DECLARED" ]; then
            echo "::error::tag base version $BASE_VERSION does not match nb4a.properties VERSION_NAME=$DECLARED"
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      # The release notes are the version's CHANGELOG.md section; a missing one fails before the build.
      - name: Changelog
        if: ${{ env.PUBLISH == 'true' }}
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: bash buildScript/release_notes.sh "$VERSION_NAME" > /dev/null
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: ${{ steps.version.outputs.channel }}
          build-number: ${{ steps.version.outputs.build_number }}
          sign: 'true'
      - name: Release assets
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist ${{ steps.version.outputs.channel }}
      - name: Upload artifact
        if: ${{ env.PUBLISH != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Flrone-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        id: publish
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: bash buildScript/publish_release.sh
      # A GitHub API outage must not lose the signed APKs.
      - name: Preserve assets when publishing fails
        if: ${{ failure() && steps.publish.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Flrone-${{ steps.version.outputs.tag }}-publish-failed
          path: dist/
          if-no-files-found: error
          retention-days: 14
