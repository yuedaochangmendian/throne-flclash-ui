name: Preview
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    name: Build and publish a preview prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # BUILD = commits since the last stable tag (vX.Y.Z), at most 998: previews of X.Y.Z sort below its release (999).
      # The tag path in release.yml numbers previews by the -pre.N suffix instead. This workflow refuses to reuse an
      # existing preview tag; release notes come from the base X.Y.Z CHANGELOG section.
      - name: Build number
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          test -n "$VERSION_NAME"
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)
          if [ -n "$LAST" ]; then COUNT=$(git rev-list --count "$LAST..HEAD"); else COUNT=$(git rev-list --count HEAD); fi
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::HEAD is the stable tag $LAST: no preview"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILD=$(( COUNT > 998 ? 998 : COUNT ))
          PREVIEW="${VERSION_NAME}-pre.${BUILD}"
          echo "Last stable tag: ${LAST:-none}, $COUNT commits since, preview ${PREVIEW}"
          {
            echo "skip=false"
            echo "build=$BUILD"
            echo "version=$PREVIEW"
            echo "tag=v${PREVIEW}"
            echo "notes_version=$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"
      - name: Check preview tag is free
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          check_rc=0
          for _ in 1 2 3; do
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              check_rc=0
            else
              check_rc=$?
            fi
            if [ "$check_rc" -eq 0 ] || [ "$check_rc" -eq 2 ]; then break; fi
            echo "::warning::git ls-remote could not reach origin (exit $check_rc); retrying"
            sleep 5
          done
          if [ "$check_rc" -eq 0 ]; then
            echo "::error::$TAG already exists: a preview tag is never reused"
            exit 1
          elif [ "$check_rc" -ne 2 ]; then
            echo "::error::could not verify whether $TAG exists (git ls-remote exit $check_rc)"
            exit 1
          fi
      - name: Use .debug package name
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Derive the preview id from nb4a.properties, the single source of truth: a
          # hardcoded id goes stale on the next PACKAGE_NAME rename. The .debug
          # suffix keeps preview and stable installable side by side.
          PKG=$(sed -n 's/^PACKAGE_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          test -n "$PKG"
          sed -i "s/^PACKAGE_NAME=.*/PACKAGE_NAME=${PKG}.debug/" nb4a.properties
          echo "Preview applicationId: ${PKG}.debug"
      - name: Build
        if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: preview
          build-number: ${{ steps.version.outputs.build }}
          sign: 'true'
      - name: Release assets
        if: steps.version.outputs.skip != 'true'
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist preview
      # Keep signed APKs available even if the GitHub release API fails.
      - name: Upload fallback artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Flrone-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish prerelease
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          NOTES_VERSION: ${{ steps.version.outputs.notes_version }}
          PRERELEASE: 'true'
        run: bash buildScript/publish_release.sh
