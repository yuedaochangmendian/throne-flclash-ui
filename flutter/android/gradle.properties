# Gradle properties of the committed Android host for this Flutter module.
#
# These are the values flutter_tools writes into the generated `flutter/.android/`
# host (templates/module/android/gradle/gradle.properties.tmpl), with one change:
# the compileSdk floor lives in build.gradle where it can be reviewed, instead of
# here.
#
# `flutter.compileSdkVersion=37` would NOT work here even though it looks like it
# should: `flutter` in a Build script is the FlutterExtension object, whose
# `compileSdkVersion` is a plain Kotlin val (36 for the pinned SDK), not a Gradle
# property lookup. The hand-edited `.android/gradle.properties` carried that line
# before this file existed and it had no effect — the 37 came from hand-editing
# `.android/Flutter/build.gradle` too, which is exactly what this host replaces.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Both are set by the Flutter app template for AGP 9; without them AGP's built-in
# Kotlin support and the `org.jetbrains.kotlin.android` plugin collide on the
# module and every Flutter plugin subproject.
android.newDsl=false
android.builtInKotlin=false
# compileSdk 37 is above the level this AGP version considers tested; the warning is
# expected (the FlClash UI's plugins require 37) and would otherwise fail a build that
# treats a warning as an error. Both spellings are required: AGP looks up the value with
# and without the platform's minor version, and a single entry only silences one of the
# two checks (`add/update android.suppressUnsupportedCompileSdk=37,37.0` is AGP's own
# suggestion, verified against this host's checkReleaseAarMetadata run).
android.suppressUnsupportedCompileSdk=37,37.0
